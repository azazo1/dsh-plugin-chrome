# dsh-plugin-chrome bundle patch
#
# This file is the `dsh.bundle.patch` layer of the plugin package: when the
# plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-plugin-chrome@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-plugin-chrome` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like a manual cordis.patch.yml mount line would.
#
# If a profile still carries an old manual mount line for this plugin in its
# own cordis.patch.yml, remove it before switching to the bundle channel to
# avoid double-mounting (two host halves, two Chrome managers).
- insert:
    - id: dsh-plugin-chrome
      name: 'dsh-plugin-chrome'
